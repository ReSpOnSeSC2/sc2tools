# Verifies that the suite version is consistent across the two places
# it's referenced:
#
#   1. apps/replay-engine/VERSION       version string (canonical)
#   2. apps/replay-engine/__init__.py   __version__ (reads #1 at runtime)
#
# A drift here means the engine reports a version that disagrees with the
# canonical file, or the lookup fell back to the unknown sentinel, so we
# hard-fail PRs the moment the two values diverge.
# Also keeps the website's loading-state agent label aligned with the agent
# package version so a release cannot leave an old version in that fallback.
# And pins the in-browser engine (Instant Analysis): INSTANT_ENGINE_VERSION in
# apps/web/lib/instant/engineVersion.ts must equal apps/replay-engine/VERSION,
# and PYODIDE_VERSION must equal the exact pyodide pin in apps/web/package.json
# (scripts/build-browser-engine.mjs enforces the same at build time).

name: version-check

on:
  pull_request:
    paths:
      - 'apps/replay-engine/VERSION'
      - 'apps/replay-engine/__init__.py'
      - 'apps/agent/sc2tools_agent/__init__.py'
      - 'apps/web/lib/agentNotice.ts'
      - 'apps/web/lib/instant/engineVersion.ts'
      - 'apps/web/package.json'
      - '.github/workflows/version-check.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare version strings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys
          import re
          from pathlib import Path

          version_path = Path('apps/replay-engine/VERSION')
          init_path    = Path('apps/replay-engine/__init__.py')

          file_version = version_path.read_text(encoding='utf-8').strip()

          # __init__.py reads the VERSION file at import time, so we exec it.
          ns = {'__file__': str(init_path)}
          exec(init_path.read_text(encoding='utf-8'), ns)
          py_version = ns.get('__version__', 'MISSING')

          print(f'VERSION      : {file_version}')
          print(f'__init__.py  : {py_version}')

          versions = {file_version, py_version}
          if len(versions) != 1:
              sys.exit(f'ERROR: version drift -- {sorted(versions)}')
          if file_version == '0.0.0+unknown':
              sys.exit('ERROR: __version__ fell back to UNKNOWN sentinel '
                       '(VERSION file could not be read)')
          print('OK -- both sources agree on', file_version)

          agent_init = Path('apps/agent/sc2tools_agent/__init__.py').read_text(encoding='utf-8')
          web_notice = Path('apps/web/lib/agentNotice.ts').read_text(encoding='utf-8')
          agent_match = re.search(r'^__version__\s*=\s*"(\d+\.\d+\.\d+)"', agent_init, re.MULTILINE)
          web_match = re.search(r'^export const FALLBACK_LATEST_AGENT_VERSION\s*=\s*"(\d+\.\d+\.\d+)"', web_notice, re.MULTILINE)
          if not agent_match or not web_match:
              sys.exit('ERROR: missing agent package version or web fallback version')
          if agent_match[1] != web_match[1]:
              sys.exit(f'ERROR: agent version drift -- package {agent_match[1]}, web fallback {web_match[1]}')
          print('OK -- agent package and web fallback agree on', agent_match[1])

          engine_ts = Path('apps/web/lib/instant/engineVersion.ts').read_text(encoding='utf-8')
          engine_match = re.search(r'^export const INSTANT_ENGINE_VERSION\s*=\s*"([^"]+)";', engine_ts, re.MULTILINE)
          pyodide_match = re.search(r'^export const PYODIDE_VERSION\s*=\s*"([^"]+)";', engine_ts, re.MULTILINE)
          if not engine_match or not pyodide_match:
              sys.exit('ERROR: engineVersion.ts lacks INSTANT_ENGINE_VERSION or PYODIDE_VERSION')
          if engine_match[1] != file_version:
              sys.exit(f'ERROR: browser engine drift -- INSTANT_ENGINE_VERSION {engine_match[1]}, '
                       f'apps/replay-engine/VERSION {file_version}')
          print('OK -- INSTANT_ENGINE_VERSION matches the engine VERSION', file_version)

          web_package = json.loads(Path('apps/web/package.json').read_text(encoding='utf-8'))
          pyodide_pin = (web_package.get('devDependencies') or {}).get('pyodide', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', pyodide_pin):
              sys.exit(f'ERROR: apps/web/package.json must pin pyodide exactly (got {pyodide_pin!r})')
          if pyodide_pin != pyodide_match[1]:
              sys.exit(f'ERROR: Pyodide drift -- package.json {pyodide_pin}, PYODIDE_VERSION {pyodide_match[1]}')
          print('OK -- PYODIDE_VERSION matches the package.json pin', pyodide_pin)
          PY
