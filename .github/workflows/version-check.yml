# Verifies that the suite version is consistent across the two places
# it's referenced:
#
#   1. apps/replay-engine/VERSION       version string (canonical)
#   2. apps/replay-engine/__init__.py   __version__ (reads #1 at runtime)
#
# A drift here means the engine reports a version that disagrees with the
# canonical file, or the lookup fell back to the unknown sentinel, so we
# hard-fail PRs the moment the two values diverge.

name: version-check

on:
  pull_request:
    paths:
      - 'apps/replay-engine/VERSION'
      - 'apps/replay-engine/__init__.py'
      - '.github/workflows/version-check.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare version strings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          from pathlib import Path

          version_path = Path('apps/replay-engine/VERSION')
          init_path    = Path('apps/replay-engine/__init__.py')

          file_version = version_path.read_text(encoding='utf-8').strip()

          # __init__.py reads the VERSION file at import time, so we exec it.
          ns = {'__file__': str(init_path)}
          exec(init_path.read_text(encoding='utf-8'), ns)
          py_version = ns.get('__version__', 'MISSING')

          print(f'VERSION      : {file_version}')
          print(f'__init__.py  : {py_version}')

          versions = {file_version, py_version}
          if len(versions) != 1:
              sys.exit(f'ERROR: version drift -- {sorted(versions)}')
          if file_version == '0.0.0+unknown':
              sys.exit('ERROR: __version__ fell back to UNKNOWN sentinel '
                       '(VERSION file could not be read)')
          print('OK -- both sources agree on', file_version)
          PY
