# Lint + typecheck + test gate for the Next.js web app (apps/web). Runs on
# every PR + push that touches the web app. Failure of any step blocks the
# merge.

name: web-ci

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + typecheck + test (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # Responsive smoke of the PUBLIC pages at 360/768/1280: renders with
  # no backend + a dummy Clerk key (graceful degradation) and no
  # body-level horizontal scroll. Auth-gated surfaces are out of scope
  # (CI holds no Clerk test credentials).
  e2e-responsive:
    name: Responsive e2e smoke (public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Format-valid dummies — public pages never call Clerk's API.
      # PRODUCTION-format (pk_live/sk_live) on purpose: a pk_test key
      # makes clerkMiddleware run the dev-instance "dev browser"
      # handshake, redirecting every real-browser document request to
      # the key's frontend-API domain — here the nonexistent
      # clerk.example.com — so Chromium/Firefox die with
      # ERR_NAME_NOT_RESOLVED while curl (not a browser) gets a 200.
      # Production instances skip that handshake entirely.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_live_dummy
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # TEMPORARY proof-of-diagnosis probe (remove once green): a
      # browser-shaped curl records whether the middleware issues the
      # Clerk dev-browser redirect that killed the suite under pk_test
      # keys. With pk_live keys it must stay 200 / no Location.
      - name: Clerk handshake probe
        run: |
          nohup npx next start -p 3210 >/tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3210/ && break; sleep 1; done
          echo "--- browser-shaped curl: status + redirect headers ---"
          curl -sS --max-time 10 -o /dev/null -D - \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" \
            http://127.0.0.1:3210/ | grep -iE "^HTTP|^location|clerk" || true
          fuser -k 3210/tcp 2>/dev/null || pkill -f "next-server" || true
          sleep 2
      - name: Run responsive smoke
        run: npx playwright test
