# Lint + typecheck + test gate for the Next.js web app (apps/web). Runs on
# every PR + push that touches the web app. Failure of any step blocks the
# merge.

name: web-ci

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + typecheck + test (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # Responsive smoke of the PUBLIC pages at 360/768/1280: renders with
  # no backend + a dummy Clerk key (graceful degradation) and no
  # body-level horizontal scroll. Auth-gated surfaces are out of scope
  # (CI holds no Clerk test credentials).
  e2e-responsive:
    name: Responsive e2e smoke (public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Format-valid dummy — public pages never call Clerk's API.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # TEMPORARY diagnostic for the ERR_NAME_NOT_RESOLVED failures:
      # separates server-side behavior (curl: status + any redirect)
      # from Chromium-outside-the-test-runner (playwright CLI) and
      # dumps proxy-related env. Remove once the e2e job is green.
      - name: Network debug probe
        run: |
          echo "--- proxy-ish env ---"
          env | sort | grep -iE 'proxy' || echo "(no proxy env)"
          echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf || true
          echo "--- /etc/hosts ---"; cat /etc/hosts || true
          nohup npx next start -p 3210 >/tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3210/ && break; sleep 1; done
          echo "--- curl -I / (headers incl. any redirect) ---"
          curl -sSi --max-time 10 http://127.0.0.1:3210/ -o /dev/null -D - || true
          echo "--- curl body first 300 bytes ---"
          curl -sS --max-time 10 http://127.0.0.1:3210/ | head -c 300; echo
          echo "--- playwright CLI screenshot http://127.0.0.1:3210/ ---"
          npx playwright screenshot --browser chromium http://127.0.0.1:3210/ /tmp/shot.png && echo "CLI-SHOT-IP-OK" || echo "CLI-SHOT-IP-FAILED"
          echo "--- playwright CLI screenshot http://localhost:3210/ ---"
          npx playwright screenshot --browser chromium http://localhost:3210/ /tmp/shot2.png && echo "CLI-SHOT-LOCALHOST-OK" || echo "CLI-SHOT-LOCALHOST-FAILED"
          echo "--- next server log ---"; tail -20 /tmp/next.log || true
          pkill -f "next start" || true
      - name: Run responsive smoke
        run: DEBUG=pw:browser npx playwright test
