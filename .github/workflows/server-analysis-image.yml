name: server-analysis-image

on:
  pull_request:
    paths:
      - 'apps/api/Dockerfile'
      - 'apps/replay-engine/requirements*.txt'
      - 'apps/replay-engine/scripts/check_server_dependencies.py'
      - '.github/workflows/server-analysis-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/Dockerfile'
      - 'apps/replay-engine/requirements*.txt'
      - 'apps/replay-engine/scripts/check_server_dependencies.py'
      - '.github/workflows/server-analysis-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-analysis-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-image:
    name: Server analysis image and dependency guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
