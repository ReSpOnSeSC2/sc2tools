# Lint + typecheck + test gate for the Express API (apps/api). Runs on
# every PR + push that touches the API. Failure of any step blocks the
# merge.
#
# The Jest suite uses mongodb-memory-server, which downloads a mongod
# binary on first run; the download is cached between runs via the
# actions cache below.

name: api-ci

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + typecheck + test (apps/api)
    runs-on: ubuntu-latest
    # The combined roadmap run finished Jest's 9,213 cases in 23m19s.
    # Checkout, dependency install, types and lint consumed the remaining
    # 25-minute job window. Allow setup and keep Jest's serial execution.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        # The full serial run reached Node's default 4 GiB heap ceiling.
        run: node --max-old-space-size=6144 node_modules/jest/bin/jest.js --runInBand --coverage=false
