# Lint + typecheck + test gate for the Express API (apps/api). Runs on
# every PR + push that touches the API. Failure of any step blocks the
# merge.
#
# The Jest suite uses mongodb-memory-server, which downloads a mongod
# binary on first run; the download is cached between runs via the
# actions cache below.

name: api-ci

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + typecheck + test (apps/api)
    runs-on: ubuntu-latest
    # The suite itself runs ~2 min runInBand (+ a couple of minutes of
    # npm ci / cold mongod download). Earlier timeout-kills were NOT
    # slowness: a leaked SSE socket in agentLive.test.js kept jest from
    # ever exiting, so every run idled to death after "117 passed".
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npx jest --runInBand --coverage=false
