# Atomic-write guard for the replay engine's storage helpers.
#
# The engine's ``core/atomic_io.py``, ``core/file_lock.py`` and
# ``core/custom_builds.py`` perform durable, crash-safe writes (temp file
# + atomic rename under a lock). ``check_atomic_writes.py`` (ADR 0016)
# fails the build if a bare ``open(path, "w")`` / ``os.rename`` sneaks in
# where an atomic write is required.
#
# Failure of this step blocks the merge.

name: data-integrity

on:
  pull_request:
    paths:
      - 'apps/replay-engine/core/**'
      - 'scripts/check_atomic_writes.py'
      - '.github/workflows/data-integrity.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint -- atomic-fs invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: ADR 0016 atomic-write guard
        run: python scripts/check_atomic_writes.py --verbose
