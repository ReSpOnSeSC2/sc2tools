# Builds the SC2 Tools Agent Windows installer (the new PySide6 GUI
# desktop app — apps/agent/). Runs on a real Windows runner so the
# PyInstaller bundle is genuinely a Windows .exe.
#
# Triggers:
#   * Manual dispatch — click "Run workflow" on the Actions tab any
#     time. Optionally pass a version override.
#   * Tag push matching `agent-v*.*.*` — produces the same artifact
#     AND attaches it to the corresponding GitHub Release.
#
# Output:
#   * dist/SC2ToolsAgent-Setup-<version>.exe
#   * dist/SC2ToolsAgent-Setup-<version>.exe.sha256
#
# Both are uploaded as a workflow artifact (downloadable from the
# Actions tab for 30 days) regardless of trigger. On tag pushes the
# files are ALSO uploaded to a draft GitHub Release. Publish that draft
# after verification and active local capture/session checks.
#
# To trigger manually: GitHub → Actions → "agent installer" → Run
# workflow. To cut a release, tag the merged commit with the exact version in
# apps/agent/sc2tools_agent/__init__.py and push that one tag.

name: agent installer

on:
  push:
    tags:
      - 'agent-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional expected version (e.g. 0.14.0). Must match sc2tools_agent/__init__.py.'
        required: false
        type: string

permissions:
  contents: write  # needed for softprops/action-gh-release on tag push
  actions: read  # SignPath verifies workflow/artifact provenance

concurrency:
  group: agent-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build agent installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        # The build script lives under apps/agent and resolves all
        # paths relative to itself, so anchor every step there.
        working-directory: apps/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so __version__ derivation works

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Always read the package version, including on a tag build. A tag
          # used to override this value silently, which could publish an
          # installer named for one version while the running agent reported
          # another. Fail the release before building if those sources drift.
          $line = Select-String -Path 'sc2tools_agent\__init__.py' `
                                -Pattern '^__version__\s*=\s*"([^"]+)"'
          if (-not $line) { throw 'No __version__ found.' }
          $packageVersion = $line.Matches[0].Groups[1].Value

          $v = '${{ inputs.version }}'
          if ($env:GITHUB_REF -like 'refs/tags/agent-v*') {
            $tagVersion = $env:GITHUB_REF -replace '^refs/tags/agent-v', ''
            if ($tagVersion -ne $packageVersion) {
              throw "Tag version '$tagVersion' does not match sc2tools_agent.__version__ '$packageVersion'."
            }
            $v = $tagVersion
          } elseif ($v -and $v -ne $packageVersion) {
            throw "Requested version '$v' does not match sc2tools_agent.__version__ '$packageVersion'."
          } elseif (-not $v) {
            $v = $packageVersion
          }

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Agent installer version must be X.Y.Z; got '$v'."
          }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Building SC2 Tools Agent v$v"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/agent/requirements.txt

      - name: Install NSIS
        shell: pwsh
        working-directory: .  # choco doesn't care; keep CWD clean
        run: |
          # community.chocolatey.org intermittently 504s; a single blip
          # must not sink a tagged release build. Retry with backoff
          # before giving up.
          $ErrorActionPreference = 'Stop'
          $max = 4
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "Installing NSIS (attempt $i/$max)..."
            choco install nsis -y --no-progress --version 3.10
            if ($LASTEXITCODE -eq 0) {
              Write-Host "NSIS installed."
              exit 0
            }
            Write-Warning "choco install nsis failed (exit $LASTEXITCODE)."
            if ($i -lt $max) {
              $delay = [Math]::Pow(2, $i) * 5  # 10s, 20s, 40s
              Write-Host "Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          throw "NSIS install failed after $max attempts."

      - name: Make NSIS available to subsequent steps
        shell: pwsh
        run: |
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path $nsisDir)) { throw "NSIS install path missing: $nsisDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Write-Host "Added $nsisDir to PATH"

      - name: Check signing configuration
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_AGENT_CONFIG: ${{ vars.SIGNPATH_AGENT_CONFIG }}
          SIGNPATH_INSTALLER_CONFIG: ${{ vars.SIGNPATH_INSTALLER_CONFIG }}
        run: |
          if ($env:SIGNPATH_ENABLED -eq 'true') {
            foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG','SIGNPATH_AGENT_CONFIG','SIGNPATH_INSTALLER_CONFIG')) {
              if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing configuration: $name" }
            }
          } elseif ($env:GITHUB_REF -like 'refs/tags/agent-v*') {
            throw 'Tagged installers require approved SignPath signing. Configure the owner prerequisites in packaging/README.md first.'
          } else {
            'Unsigned manual verification build; no signed-release claim.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Build agent bundle
        shell: pwsh
        run: |
          .\packaging\build-installer.ps1 -Version '${{ steps.ver.outputs.version }}' -Clean

      - name: Upload unsigned inner executable for signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned-agent
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-agent-${{ steps.ver.outputs.version }}
          path: apps/agent/dist/sc2tools-agent/sc2tools-agent.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign inner executable with SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_AGENT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-agent.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-agent

      - name: Verify and place signed inner executable
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signpath-agent/sc2tools-agent.exe'
          .\packaging\verify-signature.ps1 -Path $signed
          Copy-Item -LiteralPath $signed -Destination 'dist/sc2tools-agent/sc2tools-agent.exe' -Force

      - name: Package installer without rebuilding signed bundle
        shell: pwsh
        run: |
          .\packaging\build-installer.ps1 -Version '${{ steps.ver.outputs.version }}' -Installer -PackageOnly

      - name: Upload unsigned setup executable for signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-${{ steps.ver.outputs.version }}
          path: apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign setup executable with SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-setup

      - name: Verify and place signed setup executable
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signpath-setup/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe'
          .\packaging\verify-signature.ps1 -Path $signed
          .\packaging\verify-signature.ps1 -Path 'dist/sc2tools-agent/sc2tools-agent.exe'
          Copy-Item -LiteralPath $signed -Destination 'dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe' -Force
          'Inner executable and setup both have verified timestamped signatures.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = "dist\SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash *$(Split-Path $exe -Leaf)" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}
          path: |
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 30

      # The release body is this version's section of the agent
      # CHANGELOG — the same text users see in the app's update prompt
      # (the cloud feed serves release.body as releaseNotes). The
      # auto-generated PR list is appended after it by
      # generate_release_notes below; on its own that list is
      # misleading for an installer release because it includes
      # web-only PRs that ship with the site, not this .exe.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $raw = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)"
          $m = [regex]::Match($raw, $pattern)
          if ($m.Success) {
            $notes = $m.Groups[1].Value.Trim()
          } else {
            Write-Warning "No '## $v' section in apps/agent/CHANGELOG.md — release body will be the generated PR list only."
            $notes = ''
          }
          Set-Content -Path RELEASE_NOTES.generated.md -Value $notes -Encoding utf8

      # The GitHub API occasionally serves a transient 5xx ("Unicorn!")
      # page; one such blip failed the agent-v0.14.2 release after a
      # successful 7-minute build. Attempt the attach twice with a pause
      # in between so only a sustained outage can fail the job.
      - name: Attach to GitHub Release
        id: release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe.sha256
          fail_on_unmatched_files: true
          body_path: apps/agent/RELEASE_NOTES.generated.md
          generate_release_notes: true
          # Publish only after CI and local capture/session checks. A tag still
          # builds a complete installer, without restarting active users.
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

      - name: Wait before release retry
        if: startsWith(github.ref, 'refs/tags/agent-v') && steps.release.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "First release attach failed; retrying in 60 s."
          Start-Sleep -Seconds 60

      - name: Attach to GitHub Release (retry)
        if: startsWith(github.ref, 'refs/tags/agent-v') && steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe
            apps/agent/dist/SC2ToolsAgent-Setup-${{ steps.ver.outputs.version }}.exe.sha256
          fail_on_unmatched_files: true
          body_path: apps/agent/RELEASE_NOTES.generated.md
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
