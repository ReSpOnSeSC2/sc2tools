function perfTimeZone(){

function perfLocalBoundary(day,end){
 if(!day)return null;
 const d=new Date(day+(end?"T23:59:59.999":"T00:00:00.000"));
 return Number.isNaN(d.getTime())?null:d}
function perfFallbackSeasons(){
 return Array.from({length:8},(_,index)=>{const number=CUR_SEASON-index,range=seasonRangeJS(number);return {number,battlenetId:number,start:range[0],end:range[1],isCurrent:index===0,approx:true}})}
function perfRollUpSeasons(rows){
 const byId=new Map();
 (Array.isArray(rows)?rows:[]).forEach(row=>{
  const id=Number(row&&row.battlenetId);if(!Number.isFinite(id))return;
  const start=typeof row.start==="string"&&!Number.isNaN(new Date(row.start).getTime())?row.start:null;
  const end=typeof row.end==="string"&&!Number.isNaN(new Date(row.end).getTime())?row.end:null;
  const found=byId.get(id)||{number:id,battlenetId:id,start:null,end:null,isCurrent:false,approx:false,_start:Infinity,_end:-Infinity};
  const startMs=start?new Date(start).getTime():Infinity,endMs=end?new Date(end).getTime():-Infinity;
  if(startMs<found._start){found.start=start;found._start=startMs}
  if(endMs>found._end){found.end=end;found._end=endMs}
  byId.set(id,found)
 });
 const seasons=[...byId.values()].sort((a,b)=>b.number-a.number),current=seasons[0];
 seasons.forEach(s=>{s.isCurrent=s===current;delete s._start;delete s._end});
 return seasons}
async function ensurePerformanceSeasons(){
 if(PERF_SEASON_CATALOG.status==="ready"||PERF_SEASON_CATALOG.status==="fallback")return PERF_SEASON_CATALOG.items;
 if(PERF_SEASON_CATALOG.promise)return PERF_SEASON_CATALOG.promise;
 if(!SITE){PERF_SEASON_CATALOG.status="fallback";PERF_SEASON_CATALOG.items=perfFallbackSeasons();return PERF_SEASON_CATALOG.items}
 PERF_SEASON_CATALOG.status="loading";
 PERF_SEASON_CATALOG.promise=siteApi("/seasons").then(payload=>{
  const items=perfRollUpSeasons(payload&&payload.items);
  if(!items.length)throw new Error("seasons_empty");
  PERF_SEASON_CATALOG.status="ready";PERF_SEASON_CATALOG.items=items;PERF_SEASON_CATALOG.error=null;return items
 }).catch(error=>{
  PERF_SEASON_CATALOG.status="fallback";PERF_SEASON_CATALOG.items=perfFallbackSeasons();PERF_SEASON_CATALOG.error=error;return PERF_SEASON_CATALOG.items

 return PERF_SEASON_CATALOG.promise}
function perfSeasonForPreset(id){

 if(!seasons.length)return null;
 if(id==="current_season")return seasons.find(s=>s.isCurrent)||seasons[0]||null;

function performancePresets(){

 const out=[{id:"current_season",l:current?"Season "+current.number+" · current":PERF_SEASON_CATALOG.status==="loading"||PERF_SEASON_CATALOG.status==="idle"?"Loading current season…":"Current season"}];
 seasons.filter(s=>!s.isCurrent).slice(0,7).forEach(s=>out.push({id:"season:"+s.number,l:"Season "+s.number}));
 out.push({id:"last_7d",l:"Last 7 days"},{id:"last_30d",l:"Last 30 days"},{id:"last_90d",l:"Last 90 days"},{id:"all",l:"All time"},{id:"custom",l:"Custom range…"});
 return out}
function perfCatalogDate(value,season,end){
 if(!value)return null;
 if(season&&season.approx&&/^\d{4}-\d{2}-\d{2}$/.test(value))return perfLocalBoundary(value,end);
 const d=new Date(value);return Number.isNaN(d.getTime())?null:d}
function perfScopeConfig(){
 let a=null,b=null,since=null,until=null;
 if(PERF_SCOPE.preset==="custom"){
  a=PERF_SCOPE.cA||null;b=PERF_SCOPE.cB||null;since=perfLocalBoundary(a,false);until=perfLocalBoundary(b,true)
 }else if(PERF_SCOPE.preset==="current_season"||PERF_SCOPE.preset.startsWith("season:")){
  const season=perfSeasonForPreset(PERF_SCOPE.preset);
  if(season){since=perfCatalogDate(season.start,season,false);until=perfCatalogDate(season.end,season,true);if(season.isCurrent){const now=new Date();if(!until||until>now)until=now}}
 }else{
  [a,b]=presetRange(PERF_SCOPE.preset,PERF_SCOPE.cA,PERF_SCOPE.cB);since=perfLocalBoundary(a,false);until=perfLocalBoundary(b,true)
 }
 const end=until||new Date(),start=since;
 const span=start?Math.max(1,Math.ceil((end-start)/86400000)):9999;
 const interval=span<=45?"day":span<=400?"week":"month";

async function ensurePerformance(st,force){

 await ensurePerformanceSeasons();
 const req=perfRequestFor(st),existing=PERF_CACHE.get(req.key);
 if(!force&&existing&&(existing.status==="loading"||existing.status==="ready"))return;
 const requestId=++PERF_REQUEST_SEQ;
 PERF_CACHE.set(req.key,{status:"loading",requestId});
 if(tab==="performance"&&curStudent===st.id)render();
 try{
  const data=await siteApi(req.path);
  const current=PERF_CACHE.get(req.key);
  if(!current||current.requestId!==requestId)return;
  PERF_CACHE.set(req.key,{status:"ready",requestId,data});
 }catch(error){
  const current=PERF_CACHE.get(req.key);
  if(!current||current.requestId!==requestId)return;

function computeLanes(st){
 const gs=st.games||[];
 if(!gs.length)return {...(st.lanes||{active:0,bridge:0,historical:0,quarantine:0}),derived:false};
 const [aS]=seasonRangeJS(CUR_SEASON);
 const [bS]=seasonRangeJS(CUR_SEASON-1);
 const L={active:0,bridge:0,historical:0,quarantine:(st.lanes&&+st.lanes.quarantine)||0,derived:true};
 gs.forEach(g=>{const d=g.d||"";if(d>=aS)L.active++;else if(d>=bS)L.bridge++;else L.historical++});
 return L}

function parseSteps(text){
 return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
  const tm=l.match(/\b(\d{1,2}:\d{2})\b/);const c=tm?tm[1]:"";
  let rest=tm?l.replace(tm[0],""):l;
  const sm=rest.match(/^\s*(\d{1,3})\b/);const s=sm?sm[1]:"";
  if(sm)rest=rest.replace(sm[0],"");
  const n=rest.replace(/^[\s·|,-]+|[\s·|,-]+$/g,"");
  return n?{s,c,n}:null}).filter(Boolean)}

async function recToggle(sid){
 if(recState&&recState.rec&&recState.rec.state==="recording"){recState.rec.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:48000}:{});
  const chunks=[];recState={rec,chunks,t0:Date.now(),b64:null,mime:rec.mimeType||"audio/webm"};
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());clearInterval(recState.tick);

const anno={bg:null,shapes:[],tool:"circle"};
function annoInit(){anno.bg=null;anno.shapes=[];anno.tool="circle";
 const cv=$("annoCv"),ctx=cv.getContext("2d");
 anno.paint=()=>{ctx.fillStyle="#0d1626";ctx.fillRect(0,0,cv.width,cv.height);
  if(anno.bg){const im=anno.bg,r=Math.min(cv.width/im.width,cv.height/im.height);
   ctx.drawImage(im,(cv.width-im.width*r)/2,(cv.height-im.height*r)/2,im.width*r,im.height*r)}
  else{ctx.fillStyle="#54617a";ctx.font="16px 'IBM Plex Sans',sans-serif";ctx.textAlign="center";
   ctx.fillText("Upload or paste a screenshot to begin",cv.width/2,cv.height/2);ctx.textAlign="left"}
  ctx.strokeStyle="#f2c14e";ctx.lineWidth=4;ctx.lineCap="round";
  anno.shapes.forEach(s=>{ctx.beginPath();
   if(s.t==="circle"){ctx.ellipse((s.x0+s.x1)/2,(s.y0+s.y1)/2,Math.abs(s.x1-s.x0)/2+8,Math.abs(s.y1-s.y0)/2+8,0,0,7);ctx.stroke()}
   if(s.t==="arrow"){ctx.moveTo(s.x0,s.y0);ctx.lineTo(s.x1,s.y1);ctx.stroke();
    const a=Math.atan2(s.y1-s.y0,s.x1-s.x0);ctx.beginPath();
    ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-16*Math.cos(a-.45),s.y1-16*Math.sin(a-.45));
    ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-16*Math.cos(a+.45),s.y1-16*Math.sin(a+.45));ctx.stroke()}
   if(s.t==="pen"){ctx.moveTo(s.pts[0][0],s.pts[0][1]);s.pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke()}})};

  cur=anno.tool==="pen"?{t:"pen",pts:[[x,y]]}:{t:anno.tool,x0:x,y0:y,x1:x,y1:y};anno.shapes.push(cur)};

  if(cur.t==="pen")cur.pts.push([x,y]);else{cur.x1=x;cur.y1=y}anno.paint()};
