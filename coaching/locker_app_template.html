a{color:var(--blue)}

details.bo{margin-top:7px}details.bo summary{cursor:pointer;color:var(--blue);font-size:13px}

const CUR_SEASON=__CUR_SEASON__;
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function seasonRangeJS(n){
 const ANCHOR=67,A=new Date(2026,3,1).getTime(),LEN=91*86400000;
 const start=new Date(A+(n-ANCHOR)*LEN);let end=new Date(start.getTime()+LEN-1);
 const now=new Date();if(n>=CUR_SEASON||end>now)end=now;
 return [isoD(start),isoD(end)]}
function pkPresets(){
 const out=[{id:"current_season",l:"Season "+CUR_SEASON+" (current)"}];
 for(let n=CUR_SEASON-1;n>=CUR_SEASON-3;n--)out.push({id:"season:"+n,l:"Season "+n});
 out.push({id:"all",l:"All time"},{id:"after_5_0_16",l:"After 5.0.16 · 8 workers"},
  {id:"before_5_0_16",l:"Before 5.0.16 · 12 workers"},{id:"today",l:"Today"},

 return out}

 const now=new Date();
 const back=n=>{const d=new Date(now);d.setDate(d.getDate()-n);return isoD(d)};
 if(p==="all")return[null,null];
 if(p==="after_5_0_16")return["2026-06-22",null];
 if(p==="before_5_0_16")return[null,"2026-06-22"];
 if(p==="today")return[isoD(now),isoD(now)];
 if(p==="last_7d")return[back(6),isoD(now)];
 if(p==="last_30d")return[back(29),isoD(now)];
 if(p==="last_90d")return[back(89),isoD(now)];
 if(p==="custom")return[cA||null,cB||null];
 if(p&&p.startsWith("season:"))return seasonRangeJS(parseInt(p.slice(7),10));
 return seasonRangeJS(CUR_SEASON)}
function pkRange(){return presetRange(PK.preset,PK.cA,PK.cB)}

});

const recStr=L=>L.custom?(L.record||"custom build"):(L.winrate+"% · "+L.games+" games");

 if(SITE){

async function saveDownload(filename,dataB64OrText,isB64){
 if(SITE||!downloadsNS){
  try{
   const blob=isB64?new Blob([Uint8Array.from(atob(dataB64OrText),c=>c.charCodeAt(0))]):new Blob([dataB64OrText]);
   const url=URL.createObjectURL(blob);const a=document.createElement("a");

  }catch(e){toast("Download failed")}

 try{
  let data;
  if(isB64){const bin=atob(dataB64OrText);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);data=u}
  else data=dataB64OrText;

function parseSteps(text){

  const tm=l.match(/\b(\d{1,2}:\d{2})\b/);const c=tm?tm[1]:"";
  let rest=tm?l.replace(tm[0],""):l;
  const sm=rest.match(/^\s*(\d{1,3})\b/);const s=sm?sm[1]:"";
  if(sm)rest=rest.replace(sm[0],"");

async function recToggle(sid){
 if(recState&&recState.rec&&recState.rec.state==="recording"){recState.rec.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:48000}:{});
  const chunks=[];recState={rec,chunks,t0:Date.now(),b64:null,mime:rec.mimeType||"audio/webm"};
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());clearInterval(recState.tick);
   const blob=new Blob(chunks,{type:recState.mime});
   if(blob.size>2.5*1048576){toast("Recording too large — keep it under ~90 s");return}
   recState.b64=await readFileB64(blob);
   $("recOut").innerHTML=`<audio controls src="data:${recState.mime};base64,${recState.b64}"></audio>`;
   $("recBtn").textContent="● Re-record";$("recSave").disabled=false;$("recTime").textContent=""};
  rec.start();
  $("recBtn").innerHTML='<span class="rec"><span class="dot"></span> Stop</span>';
  recState.tick=setInterval(()=>{const s=Math.floor((Date.now()-recState.t0)/1000);
   $("recTime").textContent=s+"s / 90s";if(s>=90)rec.stop()},500);
 }catch(e){toast("Microphone unavailable — attach an audio file instead",3600)}}

function annotate(target,shelfSid){
 annoTarget=target||{shelf:shelfSid};
 openModal(`<h2>Annotate a screenshot</h2>
  <p class="sub">Upload or paste (Ctrl+V) any screenshot — a game frame, a replay stats screen — then draw. The student sees exactly your markup.</p>
  <div class="annotools">
   <label><input type="file" accept="image/*" style="display:none" onchange="annoLoad(this.files[0])"><span>⇪ upload image</span></label>
   <button class="on" data-t="circle" onclick="annoTool('circle',this)">◯ circle</button>
   <button data-t="arrow" onclick="annoTool('arrow',this)">→ arrow</button>
   <button data-t="pen" onclick="annoTool('pen',this)">✎ pen</button>
   <button onclick="annoUndo()">undo</button>
  </div>
  <canvas class="shot" id="annoCv" width="1200" height="560" style="margin-top:9px"></canvas>
  ${annoTarget.shelf?`<input id="mT" type="text" placeholder="Title" style="width:100%;margin-top:9px"><input id="mN" type="text" placeholder="One-line note" style="width:100%;margin-top:8px">`:""}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="annoSave()">Save annotation</button><button class="btn q" onclick="annoTarget=null;closeModal()">Cancel</button></div>`);
 requestAnimationFrame(annoInit)}
const anno={bg:null,shapes:[],tool:"circle"};
function annoInit(){anno.bg=null;anno.shapes=[];anno.tool="circle";
 const cv=$("annoCv"),ctx=cv.getContext("2d");
 anno.paint=()=>{ctx.fillStyle="#0d1626";ctx.fillRect(0,0,cv.width,cv.height);
  if(anno.bg){const im=anno.bg,r=Math.min(cv.width/im.width,cv.height/im.height);
   ctx.drawImage(im,(cv.width-im.width*r)/2,(cv.height-im.height*r)/2,im.width*r,im.height*r)}
  else{ctx.fillStyle="#54617a";ctx.font="16px 'IBM Plex Sans',sans-serif";ctx.textAlign="center";
   ctx.fillText("Upload or paste a screenshot to begin",cv.width/2,cv.height/2);ctx.textAlign="left"}
  ctx.strokeStyle="#f2c14e";ctx.lineWidth=4;ctx.lineCap="round";
  anno.shapes.forEach(s=>{ctx.beginPath();
   if(s.t==="circle"){ctx.ellipse((s.x0+s.x1)/2,(s.y0+s.y1)/2,Math.abs(s.x1-s.x0)/2+8,Math.abs(s.y1-s.y0)/2+8,0,0,7);ctx.stroke()}
   if(s.t==="arrow"){ctx.moveTo(s.x0,s.y0);ctx.lineTo(s.x1,s.y1);ctx.stroke();
    const a=Math.atan2(s.y1-s.y0,s.x1-s.x0);ctx.beginPath();
    ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-16*Math.cos(a-.45),s.y1-16*Math.sin(a-.45));
    ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-16*Math.cos(a+.45),s.y1-16*Math.sin(a+.45));ctx.stroke()}
   if(s.t==="pen"){ctx.moveTo(s.pts[0][0],s.pts[0][1]);s.pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke()}})};
 anno.paint();
 const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
  return [(p.clientX-r.left)*cv.width/r.width,(p.clientY-r.top)*cv.height/r.height]};
 let cur=null;
 cv.onpointerdown=e=>{if(!anno.bg)return;e.preventDefault();const[x,y]=pos(e);
  cur=anno.tool==="pen"?{t:"pen",pts:[[x,y]]}:{t:anno.tool,x0:x,y0:y,x1:x,y1:y};anno.shapes.push(cur)};
 cv.onpointermove=e=>{if(!cur)return;e.preventDefault();const[x,y]=pos(e);
  if(cur.t==="pen")cur.pts.push([x,y]);else{cur.x1=x;cur.y1=y}anno.paint()};
 cv.onpointerup=cv.onpointerleave=()=>{cur=null}}
function annoTool(t,btn){anno.tool=t;document.querySelectorAll(".annotools [data-t]").forEach(b=>b.classList.remove("on"));btn.classList.add("on")}
function annoUndo(){if(anno.shapes.length){anno.shapes.pop();anno.paint()}}
function annoLoad(f){if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{anno.bg=im;anno.shapes=[];anno.paint()};im.src=rd.result};rd.readAsDataURL(f)}
document.addEventListener("paste",e=>{
 if(!annoTarget)return;
 const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
 if(it)annoLoad(it.getAsFile())});
function annoSave(){
 if(!anno.bg){toast("Upload a screenshot first");return}
 const cv=$("annoCv");
 // flatten to JPEG, capped width for size
 const out=document.createElement("canvas");const W=Math.min(1400,cv.width);
 out.width=W;out.height=Math.round(cv.height*W/cv.width);
 out.getContext("2d").drawImage(cv,0,0,out.width,out.height);
 const dataURI=out.toDataURL("image/jpeg",0.85);
 if(!checkBudget(dataURI.length))return;
 if(annoTarget.shelf){
  const b64=dataURI.split(",")[1];const id=addAsset("annotated-"+Date.now()+".jpg","image/jpeg",b64);
  pushShelf(annoTarget.shelf,{ty:"image",t:$("mT").value.trim()||"Annotated frame",n:$("mN").value.trim(),asset:id});
 }else{
  const w=w_(annoTarget.sid,annoTarget.wid);w.blocks[annoTarget.bi].img=dataURI;render();toast("Annotation saved to the question");
 }
 annoTarget=null;if(annoTarget===null&&!editingWS)closeModal();else closeModal()}
