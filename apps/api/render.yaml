# Render blueprint for the SC2 Tools cloud API.
# After pushing this repo to GitHub, point Render at apps/api/render.yaml
# from "Blueprints → New Blueprint" and it provisions the service.
#
# IMPORTANT: the Docker build needs the repo ROOT as its context so it
# can COPY apps/replay-engine/ into the image. We deliberately omit
# `rootDir` (or set it to the repo root) and point dockerfilePath at
# the API's Dockerfile. Setting rootDir: apps/api would scope the
# build context to the API directory and the engine COPY would fail.
services:
  - type: web
    name: sc2tools-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /v1/health
    autoDeploy: true
    # PINNED TO ONE INSTANCE — do not increase it until the
    # realtime layer is multi-instance safe. Socket.io runs on the
    # default in-memory adapter and LiveGameBroker is in-process
    # pub/sub: with N instances, the agent's POST /v1/agent/live, the
    # web dashboard's SSE subscriber, and each OBS Browser Source
    # socket land on DIFFERENT instances (session affinity pins a
    # client, not the user), so live/overlay events silently reach only
    # a fraction of clients. Prereqs for scaling out:
    #   1. @socket.io/redis-adapter on a shared Redis/Key Value store
    #   2. LiveGameBroker snapshots + pub/sub moved to that store
    #   3. express-rate-limit moved off its per-process MemoryStore
    numInstances: 1
    # This service is intentionally pinned to one instance, so session
    # affinity is unnecessary. Render's Blueprint schema does not expose
    # the dashboard-only Session Affinity toggle. If the realtime layer is
    # made multi-instance safe later, enable that toggle in Render before
    # increasing the fixed instance count or adding autoscaling.
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sc2tools_saas
      # Heavy replay details live in Cloudflare R2. After deployment, update
      # agents and run Full Resync to rebuild objects from local replays.
      - key: GAME_DETAILS_STORE
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PREFIX
        value: game-details
      - key: REPLAY_FILES_STORE
        # Explicit rollout gate: set to r2 in Render only after agent 0.15.16
        # is published and the private bucket/lifecycle rule are ready.
        sync: false
      - key: R2_REPLAY_PREFIX
        value: raw-replays/v1
      # Optional public cost snapshot. This is a separate least-privilege
      # Cloudflare API token with Account Analytics: Read; the S3 object token
      # above cannot query GraphQL Analytics. Account id + token are all-or-none.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ANALYTICS_API_TOKEN
        sync: false
      # UTC day on which the Cloudflare billing cycle starts (1-28).
      - key: CLOUDFLARE_BILLING_CYCLE_DAY
        sync: false
      # Optional read-only Atlas Admin API diagnostics. The service account
      # needs Project Read Only and Organization Billing Viewer. Core identity
      # settings are all-or-none; expiry is shown only in authenticated admin
      # health so secret rotation cannot be missed.
      - key: ATLAS_SERVICE_ACCOUNT_ID
        sync: false
      - key: ATLAS_SERVICE_ACCOUNT_SECRET
        sync: false
      - key: ATLAS_ORG_ID
        sync: false
      - key: ATLAS_PROJECT_ID
        sync: false
      - key: ATLAS_CLUSTER_NAME
        sync: false
      - key: ATLAS_SERVICE_ACCOUNT_SECRET_EXPIRES_AT
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SERVER_PEPPER_HEX
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        # 600 (was 120): the agent's initial-import burst exhausted 120/min
        # within the first minute, tripping 429s that also halved its upload
        # batch size. Client-side Retry-After + adaptive batching remain as
        # the belt-and-suspenders bound on server load.
        value: "600"
      - key: AGENT_RELEASE_ADMIN_TOKEN
        sync: false
      # Admin access. CSV of emails (case-insensitive) — any signed-in
      # user whose verified Clerk email matches is granted the admin
      # role on their next page load. Set in the Render dashboard.
      #   e.g. you@example.com,teammate@example.com
      - key: SC2TOOLS_ADMIN_EMAILS
        sync: false
      # Optional alternative/companion: CSV of Clerk user IDs (user_xxx).
      - key: SC2TOOLS_ADMIN_USER_IDS
        sync: false
      # Optional. Set to enable Sentry error reporting; leave unset for
      # local builds. @sentry/node ships as a real dependency — boot
      # logs `sentry_state: enabled|disabled` so the wiring is visible.
      - key: SENTRY_DSN
        sync: false
      # Optional. Bearer token for GET /v1/metrics (Prometheus scrape).
      # Leave unset to keep the endpoint disabled.
      - key: METRICS_TOKEN
        sync: false
      # Optional. Mongo slow-query log threshold in ms (default 100).
      - key: SLOW_QUERY_MS
        sync: false
      # The Dockerfile pre-installs the analyzer + venv at these paths.
      # Override only if you've re-staged them somewhere else.
      - key: SC2_PY_PYTHON
        value: /opt/sc2-py/bin/python
      - key: SC2_PY_ANALYZER_DIR
        value: /opt/sc2-analyzer
      # Keep-alive heartbeat. Comma-separated list of full URLs the worker
      # GETs every 13 minutes (under Render's 15-min idle window). Set this
      # to the public web origin's /api/ping (and optionally this API's own
      # /v1/ping) to stop the starter instance from sleeping. Leave unset
      # to disable.
      #   e.g. https://sc2tools.com/api/ping,https://api.sc2tools.com/v1/ping
      - key: KEEPALIVE_TARGETS
        sync: false
      # Override the 13-minute default if your Render plan has a different
      # idle window. Value is in milliseconds; minimum enforced at 60000.
      - key: KEEPALIVE_INTERVAL_MS
        sync: false
